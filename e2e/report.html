<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agra MVP art pass — Issue #1 report</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;color:#222}
.filters button{margin:4px;padding:6px 12px;cursor:pointer}
figure{margin:16px 0}
img{max-width:100%;border:1px solid #ccc}
.dim{opacity:.15}
table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 10px;text-align:left}
.pass{color:#0a0}.fail{color:#a00}
</style>
</head>
<body>
<h1>Agra MVP art pass (Issue #1)</h1>
<p>Godot-rendered viewports. Fresh-eyes check: fort / construction site / bazaar / ghats recognizable without in-game labels.</p>
<div class="filters">
<button data-zone="all">all</button>
<button data-zone="fort">fort</button>
<button data-zone="taj">taj site</button>
<button data-zone="bazaar">bazaar</button>
<button data-zone="ghats">ghats</button>
<button data-zone="bureau">bureau</button>
</div>
<figure data-zone="fort"><img id="shot-overview" src="shots/overview.png" alt="Agra overview"><figcaption>overview — fort (red), taj site (white dome), bazaar (awnings), ghats (steps), bureau</figcaption></figure>
<figure data-zone="fort"><img id="shot-fort" src="shots/fort.png" alt="Agra Fort gate"><figcaption>fort gate — sandstone walls, towers, crenellations, durbar domes</figcaption></figure>
<figure data-zone="taj"><img id="shot-taj" src="shots/taj_ghats.png" alt="Taj construction site"><figcaption>taj site — half-dome, scaffolds, crane; guards in period dress</figcaption></figure>
<figure data-zone="bazaar"><img id="shot-bazaar" src="shots/bazaar.png" alt="Kinari Bazaar"><figcaption>bazaar — Kenney stalls, cart, crowd blend, lanterns</figcaption></figure>
<figure data-zone="ghats"><img id="shot-ghats" src="shots/ghats.png" alt="Yamuna ghats"><figcaption>ghats — steps, water, reeds hiding</figcaption></figure>
<h2>Acceptance checklist (from <code>shots/stats.json</code>)</h2>
<table id="checks"><tr><th>check</th><th>result</th></tr></table>
<script>
const zones = ['fort','taj','bazaar','ghats','bureau'];
document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
  const z = b.dataset.zone;
  document.querySelectorAll('figure').forEach(f =>
    f.classList.toggle('dim', z !== 'all' && f.dataset.zone !== z));
}));
fetch('shots/stats.json').then(r => r.json()).then(s => {
  const rows = [
    ['5 zones built', zones.every(z => (s.zones[z]||[]).length > 0)],
    ['sun shadows on', !!s.flags.shadow],
    ['distance fog on', !!s.flags.fog],
    ['warm sky on', !!s.flags.sky],
    ['hiding spots >= 5', (s.groups.hiding_spot||0) >= 5],
    ['rooftops >= 3', (s.groups.rooftop||0) >= 3],
    ['blend zones >= 1', (s.groups.blend_zone||0) >= 1],
    ['node budget < 400 (M4 perf)', (s.node_count||9999) < 400],
  ];
  const t = document.getElementById('checks');
  window.__checks = {};
  rows.forEach(([k, ok]) => {
    window.__checks[k] = ok;
    t.insertAdjacentHTML('beforeend', `<tr><td>${k}</td><td class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</td></tr>`);
  });
  window.__stats = s;
});
</script>
</body>
</html>
